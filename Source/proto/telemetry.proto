// telemetry.proto
//
// Wire format used between sensors and the telemetry server.
// Compile with: protoc --python_out=. proto/telemetry.proto
//
// TODO: Define the Reading and SensorRegistration messages.
//   At minimum, a Reading needs:
//     - sensor identifier
//     - reading type (e.g. temperature, humidity, soil_moisture, light)
//     - numeric value
//     - timestamp (Unix epoch seconds, or a google.protobuf.Timestamp)
//
//   Add any other messages your design requires.

syntax = "proto3";

package telemetry;

message Reading {
  string sensor_id = 1;       // Unique sensor identifier
  string sensor_type = 2;     // Type of sensor (temperature, humidity, soil_moisture, light, etc.)
  double value = 3;           // Numeric reading value
  int64 timestamp = 4;        // Unix epoch milliseconds
}

message SensorRegistration {
  string sensor_id = 1;       // Unique sensor identifier
  string sensor_type = 2;     // Type of sensor
  int32 interval_seconds = 3; // Reporting interval in seconds
}

message SubscriptionMessage {
  string action = 1;          // "subscribe" or "unsubscribe"
  repeated string sensor_ids = 2;  // List of sensor IDs to (un)subscribe from
}
